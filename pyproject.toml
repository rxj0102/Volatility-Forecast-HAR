[project]
name = "volatility-forecast-har"
version = "0.1.0"
description = "Research code for Volatility-Forecast-HAR"
requires-python = ">=3.11"
dependencies = [
    'numpy>=1.26',
    'pandas>=2.1',
    'scipy>=1.12',
    'yfinance>=0.2.40',
    'arch>=6.3',
    'statsmodels>=0.14',
    'scikit-learn>=1.4',
    'xgboost>=2.0',
    'matplotlib>=3.8',
    'seaborn>=0.13',
    'jupyterlab>=4.0',
    'ipykernel>=6.29',
    'pytest>=8.0'
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
